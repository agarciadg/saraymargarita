<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <title>¡Gabi Soltera, a jugar!</title>
    <meta property="og:title" content="¡Gabi Soltera, a jugar!">
    <meta property="og:description" content="¡Supera los obstáculos para ver tu invitación!">
    <meta property="og:image" content="https://i.ibb.co/TBYYXWLr/Dise-o-sin-t-tulo.png">
    <meta property="og:url" content="https://tu-enlace-aqui.com">
    <meta property="og:type" content="website">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Creepster&family=Dancing+Script:wght@700&family=Fredoka:wght@400;600&family=Oswald:wght@500;700&display=swap');

        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* ===== Variables por tema ===== */
        body {
            --fondo: #fcfaf2;
            --panel-bg: #ffffff;
            --panel-borde: #000000;
            --panel-sombra: 8px 8px 0px rgba(0,0,0,0.2);
            --texto: #000000;
            --acento: #FFD200;
            --boton-bg: #FFD200;
            --boton-texto: #000000;
            --boton-borde: #000000;
            --fuente-titulo: 'Architects Daughter', cursive;
            --fuente-texto: 'Architects Daughter', cursive;
        }
        body[data-tema="margarita"] {
            --fondo: #0b0614;
            --panel-bg: rgba(12, 6, 18, 0.94);
            --panel-borde: #c1121f;
            --panel-sombra: 0 0 30px rgba(193,18,31,0.55), inset 0 0 25px rgba(0,0,0,0.8);
            --texto: #f5f0e8;
            --acento: #c1121f;
            --boton-bg: #c1121f;
            --boton-texto: #ffffff;
            --boton-borde: #f5f0e8;
            --fuente-titulo: 'Creepster', cursive;
            --fuente-texto: 'Oswald', sans-serif;
        }
        body[data-tema="sara"] {
            --fondo: #ffe9f8;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --panel-borde: #e7a6ff;
            --panel-sombra: 0 0 30px rgba(231,166,255,0.8), 0 0 60px rgba(255,214,245,0.6);
            --texto: #6a3d8f;
            --acento: #ff8fd1;
            --boton-bg: linear-gradient(135deg, #ff9ad5, #c9a7ff);
            --boton-texto: #ffffff;
            --boton-borde: #ffffff;
            --fuente-titulo: 'Dancing Script', cursive;
            --fuente-texto: 'Fredoka', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--fondo);
            font-family: var(--fuente-texto);
            overflow: hidden; position: fixed;
        }

        #contenedor-juego { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* ===== Paneles ===== */
        .pantalla-mensaje {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 420px;
            background: var(--panel-bg); color: var(--texto);
            padding: 24px; border: 4px solid var(--panel-borde); border-radius: 0;
            text-align: center; display: flex; flex-direction: column; align-items: center; z-index: 100;
            box-shadow: var(--panel-sombra);
        }
        body[data-tema="sara"] .pantalla-mensaje { border-radius: 28px; border-width: 3px; }
        body[data-tema="margarita"] .pantalla-mensaje { border-width: 3px; }

        .pantalla-mensaje p { font-size: 1.05rem; line-height: 1.4; margin: 8px 0 14px; }

        h1 {
            font-family: var(--fuente-titulo);
            font-size: 1.6rem; margin: 8px 0; text-transform: uppercase; letter-spacing: 1px;
        }
        body[data-tema="margarita"] h1 { color: #e01e2b; font-size: 2.1rem; text-shadow: 0 0 10px rgba(224,30,43,0.7); letter-spacing: 2px; }
        body[data-tema="sara"] h1 { text-transform: none; font-size: 2.3rem; color: #b45fd6; text-shadow: 0 0 12px #fff; }

        .info-detalle {
            font-size: 1.1rem; border: 2px dashed var(--panel-borde); padding: 12px; width: 100%; margin: 10px 0;
            line-height: 1.5;
        }
        body[data-tema="sara"] .info-detalle { border-radius: 18px; }

        .etiqueta-blanco {
            font-family: var(--fuente-texto); font-weight: 700; font-size: 1rem;
            background: var(--acento); color: var(--boton-texto);
            padding: 6px 14px; border: 3px solid var(--boton-borde); margin: 8px 0; letter-spacing: 1px;
        }
        body[data-tema="sara"] .etiqueta-blanco { border-radius: 999px; }

        .boton {
            background: var(--boton-bg); color: var(--boton-texto);
            border: 3px solid var(--boton-borde); padding: 12px 30px;
            font-family: var(--fuente-texto); font-size: 1.15rem; font-weight: 700;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin: 4px;
            box-shadow: 4px 4px 0px #000;
        }
        body[data-tema="margarita"] .boton { box-shadow: 0 0 14px rgba(193,18,31,0.8); }
        body[data-tema="sara"] .boton { border-radius: 999px; box-shadow: 0 4px 16px rgba(201,167,255,0.8); text-transform: none; font-size: 1.2rem; }
        .boton.secundario { background: transparent; color: var(--texto); border-color: var(--texto); font-size: 0.9rem; padding: 8px 18px; box-shadow: none; }

        .separador { width: 100%; height: 14px; margin: 8px 0; }
        body[data-tema="margarita"] .separador {
            background: repeating-linear-gradient(90deg, #c1121f 0 10px, transparent 10px 16px);
            height: 3px; box-shadow: 0 0 8px #c1121f;
        }
        body[data-tema="sara"] .separador {
            background: radial-gradient(circle, #ff9ad5 2px, transparent 3px) 0 0 / 18px 14px,
                        radial-gradient(circle, #c9a7ff 2px, transparent 3px) 9px 7px / 18px 14px;
        }

        /* ===== Selector de personaje ===== */
        #pantalla-seleccion {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fcfaf2; padding: 16px;
            font-family: 'Architects Daughter', cursive;
        }
        #pantalla-seleccion h1 { font-family: 'Architects Daughter', cursive; font-size: 1.6rem; color: #000; text-shadow: none; text-transform: uppercase; }
        #pantalla-seleccion > p { margin: 0 0 18px; font-size: 1.1rem; text-align: center; }

        .tarjetas { display: flex; gap: 14px; width: 100%; max-width: 560px; justify-content: center; }
        .tarjeta {
            flex: 1; max-width: 250px; cursor: pointer; border: none; padding: 16px 10px 18px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: transform .15s ease;
        }
        .tarjeta:active { transform: scale(0.96); }
        .tarjeta img { width: 100%; max-width: 120px; aspect-ratio: 1; object-fit: contain; }
        .tarjeta .nombre { font-size: 1.9rem; line-height: 1; }
        .tarjeta .tema { font-size: 0.85rem; opacity: 0.85; }

        .tarjeta.margarita {
            background: radial-gradient(circle at 70% 20%, #3b1a4a, #0b0614 70%);
            border: 3px solid #c1121f; box-shadow: 0 0 18px rgba(193,18,31,0.6);
            color: #f5f0e8; font-family: 'Oswald', sans-serif;
        }
        .tarjeta.margarita .nombre { font-family: 'Creepster', cursive; color: #e01e2b; letter-spacing: 2px; }

        .tarjeta.sara {
            background: linear-gradient(180deg, #ffd6f5, #d9c6ff 60%, #c8f5ea);
            border: 3px solid #fff; border-radius: 26px; box-shadow: 0 0 20px rgba(201,167,255,0.9);
            color: #6a3d8f; font-family: 'Fredoka', sans-serif;
        }
        .tarjeta.sara .nombre { font-family: 'Dancing Script', cursive; color: #b45fd6; font-size: 2.3rem; }

        #aliento {
            position: absolute; top: 14%; width: 100%; text-align: center; padding: 0 12px;
            font-family: var(--fuente-titulo); font-size: 1.6rem; display: none;
            pointer-events: none; z-index: 10;
        }
        body[data-tema="margarita"] #aliento { color: #e01e2b; text-shadow: 0 0 10px #000, 0 0 18px rgba(224,30,43,0.8); font-size: 2rem; letter-spacing: 2px; }
        body[data-tema="sara"] #aliento { color: #fff; text-shadow: 0 0 10px #c56bff, 0 0 20px #ff8fd1; font-size: 2.2rem; }
    </style>
</head>
<body>

    <div id="contenedor-juego">
        <canvas id="juegoCanvas"></canvas>
        <div id="aliento"></div>

        <!-- 1. Elegir personaje -->
        <div id="pantalla-seleccion">
            <h1>¡Hola Gabi!</h1>
            <p>Te tenemos una invitación.<br>Elige con quién quieres jugar:</p>
            <div class="tarjetas">
                <button class="tarjeta margarita" onclick="elegirPersonaje('margarita')">
                    <img src="personaje1.png" alt="Margarita" onerror="this.style.visibility='hidden'">
                    <span class="nombre">Margarita</span>
                    <span class="tema">Noche de terror</span>
                </button>
                <button class="tarjeta sara" onclick="elegirPersonaje('sara')">
                    <img src="personaje2.png" alt="Sara" onerror="this.style.visibility='hidden'">
                    <span class="nombre">Sara</span>
                    <span class="tema">Bosque de hadas</span>
                </button>
            </div>
        </div>

        <!-- 2. Intro temática -->
        <div id="pantalla-inicio" class="pantalla-mensaje" style="display:none;">
            <div class="separador"></div>
            <h1 id="inicio-titulo"></h1>
            <p id="inicio-texto"></p>
            <button class="boton" onclick="empezarJuego()" id="inicio-boton">¡Jugar!</button>
            <button class="boton secundario" onclick="volverASeleccion()">Cambiar personaje</button>
            <div class="separador"></div>
        </div>

        <!-- 3. Victoria -->
        <div id="mensaje-victoria" class="pantalla-mensaje" style="display:none;">
            <h1 id="victoria-titulo"></h1>
            <div class="info-detalle">
                Viernes 1 de mayo • 20:00 hrs<br>
                Luis Beltrán 1660 depto 302, Ñuñoa.
            </div>
            <div class="etiqueta-blanco">VENIR DE BLANCO</div>
            <div class="separador"></div>
        </div>

        <!-- 4. Derrota -->
        <div id="mensaje-derrota" class="pantalla-mensaje" style="display:none;">
            <h1 id="derrota-titulo"></h1>
            <img src="derrota.png" alt="" style="max-width:120px; margin:8px;" onerror="this.style.display='none'">
            <p id="derrota-texto"></p>
            <button class="boton" onclick="reiniciar()">Reintentar</button>
            <button class="boton secundario" onclick="volverASeleccion()">Cambiar personaje</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');
        const alientoTxt = document.getElementById('aliento');

        /* ================= IMÁGENES ================= */
        const imgs = {};
        const cargar = (clave, archivo) => { imgs[clave] = new Image(); imgs[clave].src = archivo; };
        cargar('personaje1', 'personaje1.png');
        cargar('personaje2', 'personaje2.png');
        cargar('meta', 'meta.png');
        const OBSTACULOS = ['1', '2', '3', '4'];          // archivos 1.png, 2.png, 3.png, 4.png
        OBSTACULOS.forEach(n => cargar(n, n + '.png'));
        const lista = (img) => img && img.complete && img.naturalWidth > 0;

        /* ================= TEMAS ================= */
        const TEMAS = {
            margarita: {
                img: 'personaje1',
                inicioTitulo: '¡Hola Margarita!',
                inicioTexto: 'Es medianoche y algo se mueve entre las tumbas... Esquiva los obstáculos y sobrevive hasta descubrir tu invitación.',
                inicioBoton: '¡Correr!',
                aliento: '¡YA CASI AMANECE... CORRE!',
                victoria: '¡Sobreviviste!',
                derrotaTitulo: '¡Te atraparon!',
                derrotaTexto: 'La noche ganó esta vez. ¡Levántate y vuelve a intentarlo!',
                confeti: ['#c1121f', '#ffffff', '#7b2cbf', '#1a1a1a', '#e01e2b'],
                fondo: fondoThriller,
                suelo: sueloThriller,
                obsFallback: '#7b2cbf'
            },
            sara: {
                img: 'personaje2',
                inicioTitulo: '¡Hola Sara!',
                inicioTexto: 'El bosque encantado guarda tu invitación. Salta los obstáculos y sigue el polvo de hadas.',
                inicioBoton: '¡A volar!',
                aliento: '¡La magia está muy cerca!',
                victoria: '¡Lo lograste, hada!',
                derrotaTitulo: '¡Oh, no!',
                derrotaTexto: 'Se te escapó un poquito de magia. ¡Agita tus alas y vuelve a intentarlo!',
                confeti: ['#ff9ad5', '#c9a7ff', '#a6f0dc', '#fff3a6', '#ffffff'],
                fondo: fondoHadas,
                suelo: sueloHadas,
                obsFallback: '#ff9ad5'
            }
        };
        let temaActual = null;

        /* ================= ESTADO ================= */
        let juegoActivo = false;
        let victoriaFinalizada = false;
        let loopCorriendo = false;
        let distancia = 0;
        let velocidad = 5.5;
        let sueloY = 0;
        let obstaculos = [];
        let metaObj = null;
        let saltosCelebracion = 0;
        let confeti = [];
        let estela = [];
        let frame = 0;
        let relampago = 0;
        const META_FINAL = 16000;

        // pseudo-aleatorio estable por índice (para decorados que se repiten)
        const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

        const personaje = {
            x: 60, y: 0, w: 85, h: 85, vy: 0, g: 0.8, salto: -18, suelo: false,
            dibujar() {
                const img = imgs[temaActual.img];
                if (temaActual === TEMAS.margarita) {
                    // sombra roja tenebrosa
                    ctx.save(); ctx.shadowColor = 'rgba(224,30,43,0.8)'; ctx.shadowBlur = 18;
                } else {
                    ctx.save(); ctx.shadowColor = 'rgba(255,255,255,0.95)'; ctx.shadowBlur = 20;
                }
                if (lista(img)) {
                    ctx.drawImage(img, this.x, this.y, this.w, this.h);
                } else {
                    ctx.fillStyle = temaActual === TEMAS.margarita ? '#f5f0e8' : '#fff';
                    ctx.strokeStyle = temaActual === TEMAS.margarita ? '#c1121f' : '#c9a7ff';
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(this.x + 42, this.y + 42, 35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            },
            update() {
                this.vy += this.g;
                this.y += this.vy;
                if (this.y + this.h > sueloY) {
                    this.y = sueloY - this.h;
                    this.vy = 0;
                    if (!this.suelo && victoriaFinalizada && saltosCelebracion < 3) {
                        this.vy = this.salto;
                        saltosCelebracion++;
                        if (saltosCelebracion === 3) {
                            setTimeout(() => document.getElementById('mensaje-victoria').style.display = 'flex', 800);
                        }
                    }
                    this.suelo = true;
                } else { this.suelo = false; }
            }
        };

        /* ================= FONDOS ================= */
        function fondoThriller(off) {
            const w = canvas.width, h = canvas.height;
            // cielo nocturno
            const g = ctx.createLinearGradient(0, 0, 0, sueloY);
            g.addColorStop(0, '#05020a'); g.addColorStop(0.55, '#1d0b2b'); g.addColorStop(1, '#4a0f2a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

            // estrellas tenues
            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.3 * rnd(i, 9)})`;
                ctx.fillRect(rnd(i, 1) * w, rnd(i, 2) * sueloY * 0.6, 1.5, 1.5);
            }

            // luna llena
            const r = Math.min(w, h) * 0.09, mx = w * 0.78, my = h * 0.2;
            const halo = ctx.createRadialGradient(mx, my, r * 0.8, mx, my, r * 3);
            halo.addColorStop(0, 'rgba(255,240,210,0.35)'); halo.addColorStop(1, 'rgba(255,240,210,0)');
            ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, r * 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f6ecd2'; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(200,185,150,0.45)';
            ctx.beginPath(); ctx.arc(mx - r * 0.3, my - r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(mx + r * 0.35, my + r * 0.3, r * 0.12, 0, Math.PI * 2); ctx.fill();

            // murciélagos
            ctx.fillStyle = '#05020a';
            for (let i = 0; i < 3; i++) {
                const bx = ((frame * (1.2 + i * 0.4) + i * 400) % (w + 200)) - 100;
                const by = h * 0.12 + i * 40 + Math.sin(frame * 0.05 + i) * 12;
                const a = Math.sin(frame * 0.3 + i) * 6;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.quadraticCurveTo(bx - 10, by - 8 - a, bx - 20, by + a * 0.3);
                ctx.quadraticCurveTo(bx - 10, by - 2, bx, by + 4);
                ctx.quadraticCurveTo(bx + 10, by - 2, bx + 20, by + a * 0.3);
                ctx.quadraticCurveTo(bx + 10, by - 8 - a, bx, by);
                ctx.fill();
            }

            // árboles secos (capa lejana)
            const sepA = 280, offA = off * 0.2;
            ctx.strokeStyle = '#0a0410'; ctx.lineCap = 'round';
            for (let i = Math.floor(offA / sepA) - 1; i * sepA - offA < w + sepA; i++) {
                const x = i * sepA - offA + rnd(i, 3) * 80;
                const alto = sueloY * (0.32 + rnd(i, 4) * 0.18);
                arbolSeco(x, sueloY, alto, i);
            }

            // lápidas (capa media)
            const sepB = 210, offB = off * 0.5;
            for (let i = Math.floor(offB / sepB) - 1; i * sepB - offB < w + sepB; i++) {
                const x = i * sepB - offB + rnd(i, 5) * 90;
                const lw = 34 + rnd(i, 6) * 18, lh = 44 + rnd(i, 7) * 26;
                ctx.save();
                ctx.translate(x, sueloY);
                ctx.rotate((rnd(i, 8) - 0.5) * 0.15);
                ctx.fillStyle = '#2a2233'; ctx.strokeStyle = '#120c18'; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-lw / 2, 0); ctx.lineTo(-lw / 2, -lh + lw / 2);
                ctx.arc(0, -lh + lw / 2, lw / 2, Math.PI, 0);
                ctx.lineTo(lw / 2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#4a4058'; ctx.lineWidth = 3;
                if (rnd(i, 10) > 0.5) {
                    ctx.beginPath(); ctx.moveTo(0, -lh + 8); ctx.lineTo(0, -lh * 0.45);
                    ctx.moveTo(-8, -lh * 0.72); ctx.lineTo(8, -lh * 0.72); ctx.stroke();
                } else {
                    ctx.font = 'bold 11px Oswald, sans-serif'; ctx.fillStyle = '#4a4058'; ctx.textAlign = 'center';
                    ctx.fillText('RIP', 0, -lh * 0.55);
                }
                ctx.restore();
            }

            // niebla
            for (let i = 0; i < 6; i++) {
                const fx = ((i * 260 - off * 0.8 - frame * 0.4) % (w + 400) + w + 400) % (w + 400) - 200;
                const fg = ctx.createRadialGradient(fx, sueloY - 10, 10, fx, sueloY - 10, 160);
                fg.addColorStop(0, 'rgba(200,190,220,0.18)'); fg.addColorStop(1, 'rgba(200,190,220,0)');
                ctx.fillStyle = fg; ctx.fillRect(fx - 160, sueloY - 170, 320, 200);
            }

            // relámpago ocasional
            if (relampago <= 0 && Math.random() < 0.003) relampago = 10;
            if (relampago > 0) {
                ctx.fillStyle = `rgba(230,220,255,${relampago % 4 < 2 ? 0.25 : 0.08})`;
                ctx.fillRect(0, 0, w, h);
                relampago--;
            }
        }

        function arbolSeco(x, base, alto, i) {
            ctx.lineWidth = 9;
            ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + 6, base - alto); ctx.stroke();
            const ramas = 4;
            for (let k = 0; k < ramas; k++) {
                const yy = base - alto * (0.45 + k * 0.14);
                const dir = k % 2 ? 1 : -1;
                const largo = alto * (0.3 - k * 0.04);
                ctx.lineWidth = 5 - k;
                ctx.beginPath(); ctx.moveTo(x + 3, yy);
                ctx.quadraticCurveTo(x + dir * largo * 0.5, yy - largo * 0.2, x + dir * largo, yy - largo * (0.5 + rnd(i + k, 11) * 0.3));
                ctx.stroke();
            }
        }

        function sueloThriller(off) {
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#140b12'; ctx.fillRect(0, sueloY, w, h - sueloY);
            // textura de tierra
            const sep = 60, o = off % sep;
            ctx.fillStyle = '#22121c';
            for (let x = -o; x < w + sep; x += sep) {
                ctx.fillRect(x, sueloY + 18, 22, 4);
                ctx.fillRect(x + 30, sueloY + 42, 14, 4);
            }
            // línea roja brillante
            ctx.save();
            ctx.shadowColor = '#e01e2b'; ctx.shadowBlur = 14;
            ctx.strokeStyle = '#c1121f'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, sueloY); ctx.lineTo(w, sueloY); ctx.stroke();
            ctx.restore();
        }

        function fondoHadas(off) {
            const w = canvas.width, h = canvas.height;
            const g = ctx.createLinearGradient(0, 0, 0, sueloY);
            g.addColorStop(0, '#ffd6f5'); g.addColorStop(0.5, '#dcc8ff'); g.addColorStop(1, '#c4f2e6');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

            // destellos titilantes
            for (let i = 0; i < 45; i++) {
                const sx = rnd(i, 1) * w, sy = rnd(i, 2) * sueloY * 0.75;
                const a = 0.35 + 0.65 * Math.abs(Math.sin(frame * 0.04 + i));
                destello(sx, sy, 2 + rnd(i, 3) * 4, `rgba(255,255,255,${a})`);
            }

            // luna creciente suave
            const r = Math.min(w, h) * 0.07, mx = w * 0.8, my = h * 0.18;
            ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.fillStyle = '#ecd9ff'; ctx.beginPath(); ctx.arc(mx + r * 0.45, my - r * 0.2, r * 0.9, 0, Math.PI * 2); ctx.fill();

            // nubes (lejos)
            const sepN = 340, offN = off * 0.15 + frame * 0.2;
            for (let i = Math.floor(offN / sepN) - 1; i * sepN - offN < w + sepN; i++) {
                const x = i * sepN - offN + rnd(i, 4) * 100;
                const y = sueloY * (0.15 + rnd(i, 5) * 0.3);
                nube(x, y, 0.7 + rnd(i, 6) * 0.6);
            }

            // colinas
            ctx.fillStyle = '#b5ecd4';
            const offC = off * 0.3;
            ctx.beginPath(); ctx.moveTo(0, sueloY);
            for (let x = 0; x <= w + 20; x += 20) {
                ctx.lineTo(x, sueloY - 60 - Math.sin((x + offC) * 0.006) * 40 - Math.sin((x + offC) * 0.013) * 15);
            }
            ctx.lineTo(w, sueloY); ctx.closePath(); ctx.fill();

            // hongos (capa media)
            const sepH = 230, offH = off * 0.55;
            for (let i = Math.floor(offH / sepH) - 1; i * sepH - offH < w + sepH; i++) {
                const x = i * sepH - offH + rnd(i, 7) * 100;
                hongo(x, sueloY, 0.7 + rnd(i, 8) * 0.6, i);
            }

            // luciérnagas / polvo de hadas flotante
            for (let i = 0; i < 14; i++) {
                const fx = ((rnd(i, 12) * w - off * 0.4 - frame * 0.3) % w + w) % w;
                const fy = sueloY * (0.3 + rnd(i, 13) * 0.6) + Math.sin(frame * 0.03 + i) * 15;
                ctx.save(); ctx.shadowColor = '#fff6a6'; ctx.shadowBlur = 12;
                ctx.fillStyle = `rgba(255,246,166,${0.5 + 0.5 * Math.sin(frame * 0.08 + i)})`;
                ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        function destello(x, y, s, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y - s * 2); ctx.quadraticCurveTo(x, y, x + s * 2, y);
            ctx.quadraticCurveTo(x, y, x, y + s * 2); ctx.quadraticCurveTo(x, y, x - s * 2, y);
            ctx.quadraticCurveTo(x, y, x, y - s * 2); ctx.fill();
        }

        function nube(x, y, s) {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 26 * s, 0, Math.PI * 2);
            ctx.arc(x + 30 * s, y - 12 * s, 32 * s, 0, Math.PI * 2);
            ctx.arc(x + 64 * s, y, 24 * s, 0, Math.PI * 2);
            ctx.rect(x, y, 64 * s, 22 * s);
            ctx.fill();
        }

        function hongo(x, base, s, i) {
            const tallo = 34 * s, ancho = 46 * s;
            ctx.fillStyle = '#fff4e6';
            ctx.fillRect(x - 7 * s, base - tallo, 14 * s, tallo);
            const colores = ['#ff8fd1', '#c9a7ff', '#ff9a9a'];
            ctx.fillStyle = colores[i % 3 < 0 ? 0 : Math.abs(i) % 3];
            ctx.beginPath(); ctx.ellipse(x, base - tallo, ancho / 2, 22 * s, 0, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x - 10 * s, base - tallo - 10 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 8 * s, base - tallo - 14 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 14 * s, base - tallo - 4 * s, 2.5 * s, 0, Math.PI * 2); ctx.fill();
        }

        function sueloHadas(off) {
            const w = canvas.width, h = canvas.height;
            const g = ctx.createLinearGradient(0, sueloY, 0, h);
            g.addColorStop(0, '#9fe6bf'); g.addColorStop(1, '#7fd3b0');
            ctx.fillStyle = g; ctx.fillRect(0, sueloY, w, h - sueloY);
            // florcitas
            const sep = 55, o = off % sep;
            const cols = ['#ff8fd1', '#ffffff', '#c9a7ff', '#fff3a6'];
            for (let k = 0, x = -o; x < w + sep; x += sep, k++) {
                const idx = Math.floor((off + x) / sep);
                const fy = sueloY + 16 + rnd(idx, 14) * 40;
                ctx.fillStyle = cols[Math.abs(idx) % 4];
                for (let p = 0; p < 5; p++) {
                    const a = p * Math.PI * 2 / 5;
                    ctx.beginPath(); ctx.arc(x + Math.cos(a) * 4, fy + Math.sin(a) * 4, 3, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(x, fy, 2.5, 0, Math.PI * 2); ctx.fill();
            }
            // borde brillante
            ctx.save(); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
            ctx.strokeStyle = '#ff9ad5'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, sueloY); ctx.lineTo(w, sueloY); ctx.stroke();
            ctx.restore();
        }

        /* ================= ESTELA (polvo de hadas / chispas) ================= */
        function actualizarEstela() {
            if (frame % 2 === 0) {
                const esHada = temaActual === TEMAS.sara;
                estela.push({
                    x: personaje.x + 10, y: personaje.y + personaje.h * (0.4 + Math.random() * 0.5),
                    vx: -1.5 - Math.random() * 2, vy: (Math.random() - 0.5) * (esHada ? 1.2 : 0.4) - (esHada ? 0.3 : 0),
                    vida: 1, color: esHada ? ['#ffffff', '#ff9ad5', '#c9a7ff', '#fff3a6'][Math.floor(Math.random() * 4)] : 'rgba(80,60,90,1)'
                });
            }
            for (let i = estela.length - 1; i >= 0; i--) {
                const p = estela[i];
                p.x += p.vx; p.y += p.vy; p.vida -= 0.03;
                if (p.vida <= 0) { estela.splice(i, 1); continue; }
                ctx.globalAlpha = p.vida * (temaActual === TEMAS.sara ? 1 : 0.35);
                if (temaActual === TEMAS.sara) destello(p.x, p.y, 2.2, p.color);
                else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 6 * (1.4 - p.vida), 0, Math.PI * 2); ctx.fill(); }
                ctx.globalAlpha = 1;
            }
        }

        /* ================= LÓGICA ================= */
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            sueloY = canvas.height * 0.82;
            if (!juegoActivo) personaje.y = sueloY - personaje.h;
        }

        function manejarObstaculos() {
            if (distancia > META_FINAL - 2200) {
                alientoTxt.style.display = victoriaFinalizada ? 'none' : 'block';
                return;
            }
            alientoTxt.style.display = 'none';

            if (obstaculos.length === 0 || (canvas.width - obstaculos[obstaculos.length - 1].x > 450)) {
                if (Math.random() < 0.02) {
                    const num = OBSTACULOS[Math.floor(Math.random() * OBSTACULOS.length)];
                    const tam = 80 + Math.random() * 20;
                    obstaculos.push({ x: canvas.width, y: sueloY - tam, w: tam, h: tam, img: imgs[num] });
                }
            }

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                const o = obstaculos[i];
                o.x -= velocidad;
                if (lista(o.img)) {
                    ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
                } else {
                    ctx.fillStyle = temaActual.obsFallback;
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                }

                const m = 25;
                if (personaje.x + m < o.x + o.w - m && personaje.x + personaje.w - m > o.x + m &&
                    personaje.y + m < o.y + o.h - m && personaje.y + personaje.h - m > o.y + m) {
                    fin();
                }
                if (o.x + o.w < 0) obstaculos.splice(i, 1);
            }
        }

        function dibujarEscena() {
            temaActual.fondo(distancia);
            temaActual.suelo(distancia);
        }

        function loop() {
            if (!juegoActivo && !victoriaFinalizada) { loopCorriendo = false; return; }
            loopCorriendo = true;
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!victoriaFinalizada) {
                distancia += velocidad;
                velocidad = 5.5 + (distancia / 8000);
            }

            dibujarEscena();
            actualizarEstela();

            personaje.update();
            personaje.dibujar();

            if (!victoriaFinalizada) manejarObstaculos();

            if (distancia >= META_FINAL && !metaObj) {
                metaObj = { x: canvas.width, y: sueloY - 240, w: 240, h: 240 };
            }
            if (metaObj) {
                if (!victoriaFinalizada) metaObj.x -= velocidad;
                if (lista(imgs.meta)) ctx.drawImage(imgs.meta, metaObj.x, metaObj.y, metaObj.w, metaObj.h);
                if (!victoriaFinalizada && personaje.x + personaje.w > metaObj.x + 60) {
                    victoriaFinalizada = true;
                    alientoTxt.style.display = 'none';
                    personaje.vy = personaje.salto;
                    crearConfeti();
                }
            }

            confeti.forEach(p => {
                ctx.fillStyle = p.color;
                if (temaActual === TEMAS.sara) destello(p.x, p.y, p.r * 0.8, p.color);
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
                p.y += p.v; p.x += Math.sin((p.y + p.r * 50) * 0.02) * 0.6;
                if (p.y > canvas.height) p.y = -20;
            });

            requestAnimationFrame(loop);
        }

        function iniciarLoop() { if (!loopCorriendo) loop(); }

        function crearConfeti() {
            const cols = temaActual.confeti;
            for (let i = 0; i < 90; i++) {
                confeti.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 5 + 2, color: cols[Math.floor(Math.random() * cols.length)], v: Math.random() * 4 + 2
                });
            }
        }

        /* ================= PANTALLAS ================= */
        function elegirPersonaje(nombre) {
            temaActual = TEMAS[nombre];
            document.body.dataset.tema = nombre;
            document.getElementById('pantalla-seleccion').style.display = 'none';
            document.getElementById('inicio-titulo').textContent = temaActual.inicioTitulo;
            document.getElementById('inicio-texto').textContent = temaActual.inicioTexto;
            document.getElementById('inicio-boton').textContent = temaActual.inicioBoton;
            document.getElementById('victoria-titulo').textContent = temaActual.victoria;
            document.getElementById('derrota-titulo').textContent = temaActual.derrotaTitulo;
            document.getElementById('derrota-texto').textContent = temaActual.derrotaTexto;
            alientoTxt.textContent = temaActual.aliento;
            resetEstado();
            redimensionar();
            dibujarEscena();
            personaje.dibujar();
            document.getElementById('pantalla-inicio').style.display = 'flex';
        }

        function volverASeleccion() {
            juegoActivo = false; victoriaFinalizada = false;
            ['pantalla-inicio', 'mensaje-derrota', 'mensaje-victoria'].forEach(id => document.getElementById(id).style.display = 'none');
            alientoTxt.style.display = 'none';
            delete document.body.dataset.tema;
            document.getElementById('pantalla-seleccion').style.display = 'flex';
        }

        function resetEstado() {
            distancia = 0; velocidad = 5.5; obstaculos = []; metaObj = null;
            victoriaFinalizada = false; saltosCelebracion = 0; confeti = []; estela = [];
            personaje.vy = 0; personaje.y = sueloY - personaje.h;
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            redimensionar();
            resetEstado();
            juegoActivo = true;
            iniciarLoop();
        }

        function fin() {
            juegoActivo = false;
            document.getElementById('mensaje-derrota').style.display = 'flex';
        }

        function reiniciar() {
            document.getElementById('mensaje-derrota').style.display = 'none';
            resetEstado();
            juegoActivo = true;
            iniciarLoop();
        }

        /* ================= CONTROLES ================= */
        window.addEventListener('resize', () => { redimensionar(); if (temaActual && !juegoActivo && !victoriaFinalizada) { dibujarEscena(); personaje.dibujar(); } });
        const saltar = (e) => {
            if (e.type === 'touchstart') e.preventDefault();
            if ((juegoActivo || victoriaFinalizada) && personaje.suelo) personaje.vy = personaje.salto;
        };
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); saltar(e); } });
        canvas.addEventListener('touchstart', saltar, { passive: false });
        canvas.addEventListener('mousedown', saltar);

        redimensionar();
    </script>
</body>
</html>
